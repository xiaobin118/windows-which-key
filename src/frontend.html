<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which-Key</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: transparent;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        .container {
            display: none;
            width: min(640px, calc(100vw - 32px));
            background:
                radial-gradient(circle at 100% 0%, rgba(111, 92, 255, 0.18), transparent 38%),
                linear-gradient(145deg, rgba(19, 25, 48, 0.94), rgba(11, 15, 31, 0.91));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(145, 164, 255, 0.2);
            border-radius: 20px;
            padding: 18px;
            max-height: 100vh;
            overflow-y: auto;
        }

        .container.visible {
            display: block;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 4px 4px 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            color: #dfe7ff;
            font: 700 16px/1 Consolas, 'Courier New', monospace;
            background: linear-gradient(135deg, #618cff, #8c6bff);
            border-radius: 10px;
        }

        .title {
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 3px;
            color: rgba(210, 220, 255, 0.56);
            font-size: 11px;
        }

        .context-chip {
            flex: 0 0 auto;
            padding: 6px 9px;
            color: #a9c5ff;
            font: 700 10px/1 Consolas, 'Courier New', monospace;
            letter-spacing: 0.08em;
            background: rgba(83, 137, 255, 0.12);
            border: 1px solid rgba(111, 155, 255, 0.24);
            border-radius: 999px;
        }

        .breadcrumb {
            font-size: 12px;
            color: rgba(210, 220, 255, 0.58);
            margin: 0 4px 12px;
            padding: 10px 0 12px;
            border-top: 1px solid rgba(145, 164, 255, 0.12);
            border-bottom: 1px solid rgba(145, 164, 255, 0.12);
        }

        .breadcrumb span { margin: 0 3px; }
        .breadcrumb span:last-child { color: #dfe7ff; font-weight: 600; }

        .entries { display: flex; flex-direction: column; gap: 6px; }

        .entry {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }

        .entry:hover {
            background: rgba(117, 145, 255, 0.12);
            border-color: rgba(126, 154, 255, 0.2);
            transform: translateX(2px);
        }

        .entry.group {
            border-left: 3px solid #6d8dff;
            padding-left: 9px;
            background: rgba(93, 116, 255, 0.08);
        }

        .key {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            color: #a9c5ff;
            min-width: 74px;
            text-align: center;
            background: rgba(83, 137, 255, 0.13);
            border: 1px solid rgba(111, 155, 255, 0.2);
            padding: 4px 8px;
            border-radius: 7px;
            margin-right: 12px;
        }

        .desc { font-size: 13px; color: rgba(237, 241, 255, 0.92); flex: 1; }

        .group-indicator {
            font-size: 11px;
            color: rgba(142, 167, 255, 0.85);
            margin-left: auto;
            padding-left: 8px;
        }

        .app-name, .category { font-weight: 700; margin: 8px 4px; }
        .app-name { color: #edf1ff; font-size: 14px; }
        .category { color: #a9c5ff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
        .entry.essential .desc { font-weight: 700; }
        .entry.recommended .desc { font-weight: 500; }
        .entry.advanced .desc { opacity: 0.72; }

        .footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            padding: 0 4px;
            color: rgba(210, 220, 255, 0.42);
            font: 10px Consolas, 'Courier New', monospace;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container.visible {
            animation: fadeIn 0.2s ease-out;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="topbar">
            <div class="brand">
                <div class="brand-mark">⌘</div>
                <div>
                    <div class="title">Which-Key</div>
                    <div class="subtitle">Keyboard shortcuts available in this context</div>
                </div>
            </div>
            <div class="context-chip">ACTIVE · GLOBALS</div>
        </div>
        <div class="app-name" id="app-name"></div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="entries" id="entries"></div>
        <div class="footer">ESC to close</div>
    </div>

    <script>
        const container = document.getElementById('container');
        const breadcrumbEl = document.getElementById('breadcrumb');
        const entriesEl = document.getElementById('entries');
        const appNameEl = document.getElementById('app-name');

        function renderEntries(entries, breadcrumb, clear = true) {
            // Update breadcrumb
            if (breadcrumb.length > 0) {
                breadcrumbEl.replaceChildren();
                breadcrumb.forEach((item, index) => {
                    if (index > 0) {
                        const separator = document.createElement('span');
                        separator.textContent = '›';
                        breadcrumbEl.appendChild(separator);
                    }

                    const crumb = document.createElement('span');
                    crumb.textContent = item;
                    breadcrumbEl.appendChild(crumb);
                });
                breadcrumbEl.style.display = 'block';
            } else {
                breadcrumbEl.replaceChildren();
                breadcrumbEl.style.display = 'none';
            }

            // Clear and render entries
            if (clear) entriesEl.replaceChildren();
            entries.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'entry ' + (entry.priority || 'recommended') + (entry.is_group ? ' group' : '');

                const keySpan = document.createElement('span');
                keySpan.className = 'key';
                keySpan.textContent = entry.key;

                const descSpan = document.createElement('span');
                descSpan.className = 'desc';
                descSpan.textContent = entry.desc;

                div.appendChild(keySpan);
                div.appendChild(descSpan);

                if (entry.is_group) {
                    const indicator = document.createElement('span');
                    indicator.className = 'group-indicator';
                    indicator.textContent = '▶';
                    div.appendChild(indicator);
                }

                entriesEl.appendChild(div);
            });
        }

        function renderGroupedEntries(entries) {
            entriesEl.replaceChildren();
            const categories = new Map();
            entries.forEach(entry => {
                const category = entry.category || 'Other';
                if (!categories.has(category)) categories.set(category, []);
                categories.get(category).push(entry);
            });
            categories.forEach((categoryEntries, category) => {
                const heading = document.createElement('div');
                heading.className = 'category';
                heading.textContent = category;
                entriesEl.appendChild(heading);
                renderEntries(categoryEntries, [], false);
            });
        }

        function show() {
            container.classList.add('visible');
        }

        function hide() {
            container.classList.remove('visible');
        }

        // Listen for messages from Rust
        window.addEventListener('message', (event) => {
            const data = event.data;

            if (typeof data === 'string') {
                try {
                    const parsed = JSON.parse(data);
                    handleMessage(parsed);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            } else {
                handleMessage(data);
            }
        });

        function handleMessage(data) {
            switch (data.type) {
                case 'show':
                    appNameEl.style.display = 'none';
                    show();
                    renderEntries(data.entries || [], data.breadcrumb || []);
                    break;
                case 'update':
                    appNameEl.style.display = 'none';
                    renderEntries(data.entries || [], data.breadcrumb || []);
                    break;
                case 'showAll':
                    appNameEl.textContent = data.appName || 'Windows';
                    appNameEl.style.display = 'block';
                    breadcrumbEl.style.display = 'none';
                    show();
                    renderGroupedEntries(data.entries || []);
                    break;
                case 'hide':
                    hide();
                    break;
            }
        }

        // Initial state: hidden
        hide();
    </script>
</body>
</html>
