schema_version = 1
id = "vscode"
name = "Visual Studio Code"
processes = ["Code.exe"]

[[bindings]]
keys = ["Ctrl+P"]
description = "按文件名快速打开文件"
category = "常用"
priority = "essential"
[[bindings]]
keys = ["Ctrl+Shift+N"]
description = "新建窗口"
category = "常用"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+P", "F1"]
description = "打开命令面板"
category = "常用"
priority = "essential"
[[bindings]]
keys = ["Ctrl+`"]
description = "显示／隐藏终端"
category = "常用"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+B"]
description = "显示／隐藏侧边栏"
category = "常用"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+N"]
description = "新建文件"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+W"]
description = "关闭当前编辑器"
category = "常用"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Tab"]
description = "切换到下一个编辑器"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+Tab"]
description = "切换到上一个编辑器"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+E"]
description = "打开文件资源管理器"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+F"]
description = "在整个项目中搜索"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+/"]
description = "切换行注释"
category = "编辑"
priority = "essential"
[[bindings]]
keys = ["Shift+Alt+A"]
description = "切换块注释"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Alt+Up"]
description = "向上移动当前行"
category = "编辑"
priority = "essential"
[[bindings]]
keys = ["Alt+Down"]
description = "向下移动当前行"
category = "编辑"
priority = "essential"
[[bindings]]
keys = ["Shift+Alt+Up"]
description = "向上复制当前行"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Shift+Alt+Down"]
description = "向下复制当前行"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+D"]
description = "依次选择下一个相同内容"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+L"]
description = "选择所有相同内容"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Space"]
description = "显示代码补全"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+O"]
description = "跳转到文件中的符号"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+K", "Ctrl+W"]
description = "关闭所有编辑器"
category = "常用"
priority = "recommended"
sequence = true
[[bindings]]
keys = ["F2"]
description = "重命名变量、函数或类型"
category = "编辑"
priority = "essential"
[[bindings]]
keys = ["F12"]
description = "跳转到定义"
category = "导航"
priority = "essential"
[[bindings]]
keys = ["Alt+Left"]
description = "返回代码位置"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Alt+Right"]
description = "前进代码位置"
category = "导航"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+Shift+K"]
description = "删除整行"
category = "编辑"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+K", "Ctrl+U"]
description = "转换为大写"
category = "编辑"
priority = "recommended"
sequence = true
[[bindings]]
keys = ["Ctrl+K", "Ctrl+L"]
description = "转换为小写"
category = "编辑"
priority = "recommended"
sequence = true
[[bindings]]
keys = ["Ctrl+K", "Ctrl+F"]
description = "格式化选中代码"
category = "格式"
priority = "recommended"
sequence = true
[[bindings]]
keys = ["Shift+Alt+F"]
description = "格式化整个文件"
category = "格式"
priority = "recommended"
[[bindings]]
keys = ["Ctrl+K", "Ctrl+S"]
description = "打开快捷键设置"
category = "常用"
priority = "recommended"
sequence = true
